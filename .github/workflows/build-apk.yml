
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      
      - name: Prepare Capacitor
        run: |
          mkdir -p www
          cp index.html style.css game.js www/

          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6 @capacitor/assets

          npx cap init "Masa Arxasında" com.company.behindtable --web-dir=www
          npx cap add android

          npx capacitor-assets generate --android --iconBackgroundColor '#160000'

          npx cap sync android
          
          cp index.html style.css game.js www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6
          npx cap init "Masa Arxasında" com.company.behindtable --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Masa-Arxasında-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
